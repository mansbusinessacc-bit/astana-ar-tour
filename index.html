<body>
  <div class="device">
    <nav class="site-nav" id="siteNav" aria-label="Main">
      <a class="site-brand" href="#/home"><span class="site-logo"><i></i><i></i><i></i></span>Astana AR Tour</a>
      <div class="site-links">
